<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#000"/>
  <!-- Glow layers -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#A49AF3" stroke-width="3" filter="url(#g)" opacity="0.7"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#A49AF3" stroke-width="1.8" filter="url(#g2)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#B5AEF4" stroke-width="1.2"/>
  <!-- Horizontal ring with glow -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#A49AF3" stroke-width="2.5" filter="url(#g)" opacity="0.7"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#A49AF3" stroke-width="1.5" filter="url(#g2)"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#B5AEF4" stroke-width="1"/>
  <!-- Star flares at intersections -->
  <ellipse cx="12" cy="32" rx="4" ry="1.5" fill="#B5AEF4" filter="url(#g2)" opacity="0.8"/>
  <ellipse cx="12" cy="32" rx="1.5" ry="4" fill="#B5AEF4" filter="url(#g2)" opacity="0.6"/>
  <ellipse cx="52" cy="32" rx="4" ry="1.5" fill="#B5AEF4" filter="url(#g2)" opacity="0.8"/>
  <ellipse cx="52" cy="32" rx="1.5" ry="4" fill="#B5AEF4" filter="url(#g2)" opacity="0.6"/>
</svg>
